spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/super_star_oauth?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:9001}
  internal-token: ${USER_INTERNAL_TOKEN:local-user-internal-token}

logging:
  level:
    org.springframework.security: DEBUG
