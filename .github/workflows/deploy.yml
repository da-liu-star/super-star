name: Deploy Backend To Aliyun

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: super-star-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout frontend source
        uses: actions/checkout@v4
        with:
          repository: da-liu-star/super-star-web
          ref: main
          path: frontend-source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Validate backend
        run: mvn -q test

      - name: Package sources
        run: |
          mkdir -p /tmp/super-star-release/frontend
          mkdir -p /tmp/super-star-release/backend

          tar -C "$GITHUB_WORKSPACE/frontend-source" \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            -cf - . | tar -C /tmp/super-star-release/frontend -xf -

          tar -C "$GITHUB_WORKSPACE" \
            --exclude=.git \
            --exclude=frontend-source \
            --exclude=target \
            -cf - . | tar -C /tmp/super-star-release/backend -xf -

          tar -C /tmp/super-star-release \
            -czf "release-source-${{ github.sha }}.tgz" .

      - name: Upload source archive
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT }}
          source: release-source-${{ github.sha }}.tgz
          target: /tmp

      - name: Build and deploy Docker stack
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT }}
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail

            APP_ROOT=/opt/super-star
            ARCHIVE="/tmp/release-source-${{ github.sha }}.tgz"
            SOURCE_ROOT=$(mktemp -d /tmp/super-star-source.XXXXXX)
            trap 'rm -rf "$SOURCE_ROOT"; rm -f "$ARCHIVE"' EXIT

            mkdir -p "$APP_ROOT"

            tar -xzf "$ARCHIVE" -C "$SOURCE_ROOT"

            bash "$SOURCE_ROOT/frontend/deploy/deploy-stack.sh" \
              "$SOURCE_ROOT/frontend" \
              "$SOURCE_ROOT/backend"
